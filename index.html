<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chord Board">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./styles.css?v=24-1">
  <title>ST Guitar Chord Board</title>
</head>
<body>
  <main id="app">
    <div class="top-row">
      <label class="search-wrap">
        <span class="sr-only">Akor ara</span>
        <input id="chord-search" type="search" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Am, E, A5, G7, F#maj7">
      </label>
      <button id="tuner-button" class="tuner-button" type="button" aria-label="Kromatik tuneri aç" aria-haspopup="dialog" aria-controls="tuner-panel" aria-expanded="false">
        <img src="./icon-192.png" width="36" height="36" alt="">
      </button>
    </div>

    <div id="suggestions" class="suggestions" aria-label="Aynı kökten akor ailesi"></div>

    <button id="chord-button" class="chord-button" type="button" aria-label="Seçili akoru çal" aria-describedby="chord-accessibility-description">
      <div class="chord-heading">
        <strong id="chord-symbol">C</strong>
        <span id="chord-reading">Do majör</span>
      </div>
      <span id="chord-accessibility-description" class="sr-only"></span>
      <div id="strings" class="strings" aria-hidden="true"></div>
    </button>

    <nav class="variants" aria-label="Akor varyasyonları">
      <button id="prev" type="button" aria-label="Önceki varyasyon">‹</button>
      <span id="variant-count">1 / 3</span>
      <button id="next" type="button" aria-label="Sonraki varyasyon">›</button>
    </nav>

    <div id="relation" class="relation" aria-label="Akor ilişkisi" hidden></div>
    <p id="status" class="status" aria-live="polite"></p>
    <p id="chord-accessibility-status" class="sr-only" aria-live="polite"></p>
  </main>

  <section id="tuner-panel" class="tuner-panel" role="dialog" aria-modal="true" aria-label="Kromatik tuner" aria-hidden="true" hidden>
    <div class="tuner-card">
      <button id="tuner-close" class="tuner-close" type="button" aria-label="Tuneri kapat">×</button>
      <p class="tuner-kicker">Kromatik Tuner</p>
      <div id="tuner-dial" class="tuner-dial" data-in-tune="false">
        <div id="tuner-note-ring" class="tuner-note-ring" aria-hidden="true"></div>
        <div class="tuner-needle-layer" aria-hidden="true">
          <span id="tuner-needle" class="tuner-needle"></span>
          <span class="tuner-hub"></span>
        </div>
        <div class="tuner-readout">
          <div class="tuner-note-line"><strong id="tuner-note">—</strong><span id="tuner-octave"></span></div>
          <span id="tuner-frequency">— Hz</span>
          <span id="tuner-cents">— cent</span>
        </div>
      </div>
      <p id="tuner-status" class="tuner-status" aria-live="polite"></p>
      <p class="tuner-reference">A4 = 440 Hz</p>
    </div>
  </section>

  <script type="module" src="./src/app.js?v=24-1"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js?v=24-1").catch(()=>{});
  </script>
</body>
</html>
