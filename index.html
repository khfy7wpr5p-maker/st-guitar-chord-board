<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>ST Guitar Chord Board</title>
</head>
<body>
  <main id="app">
    <label class="search-wrap">
      <span class="sr-only">Akor ara</span>
      <input id="chord-search" type="search" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Am, E, G7, F#maj7">
    </label>

    <button id="chord-button" class="chord-button" type="button" aria-label="Seçili akoru çal">
      <div class="chord-heading">
        <strong id="chord-symbol">C</strong>
        <span id="chord-reading">Do majör</span>
      </div>
      <div id="strings" class="strings" aria-hidden="true"></div>
    </button>

    <nav class="variants" aria-label="Akor varyasyonları">
      <button id="prev" type="button" aria-label="Önceki varyasyon">‹</button>
      <span id="variant-count">1 / 3</span>
      <button id="next" type="button" aria-label="Sonraki varyasyon">›</button>
    </nav>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script type="module" src="./src/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  </script>
</body>
</html>
