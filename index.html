<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chord Board">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>ST Guitar Chord Board</title>
</head>
<body>
  <main id="app">
    <header class="brand" aria-label="ST Guitar Chord Board">
      <img class="brand-mark" src="./assets/icon-512.svg" alt="" aria-hidden="true">
      <span class="brand-name">ST Guitar Chord Board</span>
    </header>

    <label class="search-wrap">
      <span class="sr-only">Akor ara</span>
      <input id="chord-search" type="search" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Am, E, A5, G7, F#maj7">
    </label>

    <div id="suggestions" class="suggestions" aria-label="Aynı kökten akor ailesi"></div>

    <button id="chord-button" class="chord-button" type="button" aria-label="Seçili akoru çal">
      <div class="chord-heading">
        <strong id="chord-symbol">C</strong>
        <span id="chord-reading">Do majör</span>
      </div>
      <div id="strings" class="strings" aria-hidden="true"></div>
    </button>

    <nav class="variants" aria-label="Akor varyasyonları">
      <button id="prev" type="button" aria-label="Önceki varyasyon">‹</button>
      <span id="variant-count">1 / 3</span>
      <button id="next" type="button" aria-label="Sonraki varyasyon">›</button>
    </nav>

    <div id="relation" class="relation" aria-label="Akor ilişkisi" hidden></div>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script type="module" src="./src/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  </script>
</body>
</html>
